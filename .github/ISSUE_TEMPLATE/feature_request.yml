name: ✨ Feature request
description: Suggest a new capability, document type, or improvement
title: "[Feature]: "
labels: ["enhancement", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. The clearer the problem is, the easier it is to judge
        the solution — so please start with what you were trying to do.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: The situation you ran into, not the solution you have in mind.
      placeholder: |
        I need to process Bangladeshi passport pages alongside NIDs, and right now
        I have to run a second service for them.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: What would you like to see?
      description: Describe the behaviour you want, including the API shape if relevant.
      placeholder: |
        A `PASSPORT` value for the `type` form field, returning
        { "type": "PASSPORT", "details": { "passport_number": "...", "name": "...", "date_of_birth": "..." } }
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: What kind of change is this?
      options:
        - New document type
        - Better extraction accuracy
        - New or changed API endpoint
        - Performance
        - Deployment / packaging (Docker, etc.)
        - Developer experience (tests, CI, tooling)
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
      description: Other approaches, or how you are working around it today.
    validations:
      required: false

  - type: checkboxes
    id: contribution
    attributes:
      label: Would you like to work on this?
      options:
        - label: I am willing to open a pull request for this.
        - label: I would need guidance to get started.

  - type: textarea
    id: context
    attributes:
      label: Anything else
      description: Links, references, sample documents (redacted or synthetic only).
    validations:
      required: false
